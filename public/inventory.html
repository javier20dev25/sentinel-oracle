<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token Inventory — Sentinel Oracle</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { background: #07080a; }
  .inv-nav { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; background: #0a0c0f; border-bottom: 0.5px solid rgba(255,255,255,0.06); }
  .inv-nav .nav-title { color: #e6e8eb; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; }
  .inv-nav a { color: #388bfd; text-decoration: none; font-size: 0.72rem; }
  .inv-nav a:hover { text-decoration: underline; }
  .stats-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.875rem; }
  .stat-card { flex: 1; min-width: 100px; padding: 0.75rem; background: #14161a; border: 0.5px solid rgba(255,255,255,0.05); text-align: center; }
  .stat-card .stat-value { font-size: 1.25rem; color: #e6e8eb; font-weight: 400; }
  .stat-card .stat-label { font-size: 0.6rem; color: #656b75; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.25rem; }
  .stat-card.high-risk { border-color: rgba(240,37,58,0.2); }
  .stat-card.expiring { border-color: rgba(210,153,34,0.2); }
  .toolbar { display: flex; gap: 0.4rem; margin-bottom: 0.875rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.72rem; }
  th { text-align: left; padding: 0.35rem 0.4rem; color: #656b75; font-weight: 400; text-transform: uppercase; font-size: 0.62rem; letter-spacing: 0.05em; border-bottom: 0.5px solid rgba(255,255,255,0.06); }
  td { padding: 0.35rem 0.4rem; border-bottom: 0.5px solid rgba(255,255,255,0.04); }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .token-type { font-size: 0.65rem; padding: 0.1rem 0.35rem; }
  .token-type.github_pat { color: #d29922; border: 0.5px solid rgba(210,153,34,0.2); background: rgba(210,153,34,0.04); }
  .token-type.github_app { color: #26cd6b; border: 0.5px solid rgba(38,205,107,0.2); background: rgba(38,205,107,0.04); }
  .token-type.github_oauth { color: #388bfd; border: 0.5px solid rgba(56,139,253,0.2); background: rgba(56,139,253,0.04); }
  .token-type.found_secret { color: #f0253a; border: 0.5px solid rgba(240,37,58,0.2); background: rgba(240,37,58,0.04); }
  .token-type.generic { color: #656b75; border: 0.5px solid rgba(255,255,255,0.08); }
  .risk-low { color: #26cd6b; }
  .risk-medium { color: #d29922; }
  .risk-high { color: #f0253a; }
  .risk-critical { color: #f0253a; font-weight: 500; }
  .delete-btn { color: #f0253a; border-color: rgba(240,37,58,0.2); font-size: 0.65rem; padding: 0.2rem 0.5rem; }
  .delete-btn:hover { background: rgba(240,37,58,0.06); border-color: rgba(240,37,58,0.4); }
  #scan-status { margin-top: 0.5rem; }
  .inv-container { max-width: 900px; margin: 0 auto; padding: 1rem; }
</style>
</head>
<body>
<div class="inv-nav">
  <span class="nav-title">Token Inventory</span>
  <a href="/">&larr; Dashboard</a>
</div>

<main class="inv-container">
  <section class="section">
    <div class="stats-row" id="stats-row">
      <div class="stat-card"><div class="stat-value" id="stat-total">-</div><div class="stat-label">Total Tokens</div></div>
      <div class="stat-card high-risk"><div class="stat-value" id="stat-high-risk">-</div><div class="stat-label">High Risk</div></div>
      <div class="stat-card expiring"><div class="stat-value" id="stat-expiring">-</div><div class="stat-label">Expiring Soon</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-expired">-</div><div class="stat-label">Expired</div></div>
    </div>

    <div class="toolbar">
      <button id="scan-btn" class="scan-btn">Scan Now</button>
      <button id="drift-btn" style="color:#8957e5;border-color:rgba(137,87,229,0.2);">Check Drift</button>
    </div>
    <div id="scan-status"></div>
    <div id="drift-results" style="display:none;margin-bottom:0.875rem;"></div>
  </section>

  <section class="section">
    <h2>Tokens</h2>
    <div id="token-table-wrapper">
      <table id="token-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Scopes</th>
            <th>Risk</th>
            <th>First Seen</th>
            <th>Last Seen</th>
            <th>Expires</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="token-tbody">
          <tr><td colspan="8" class="empty" style="text-align:center;">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<script src="/app.js"></script>
<script>
(function () {
  'use strict';

  async function api(path, options) {
    const res = await fetch(path, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        ...(options?.headers || {}),
        ...(window.__csrfToken ? { 'X-CSRF-Token': window.__csrfToken } : {}),
      },
    });
    if (!res.ok) {
      if (res.status === 401) {
        window.location.href = '/';
        return;
      }
      const body = await res.json().catch(function () { return {} });
      throw new Error(body.error || 'Request failed (' + res.status + ')');
    }
    return res.json();
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function riskClass(score) {
    if (score === 'critical') return 'risk-critical';
    if (score === 'high') return 'risk-high';
    if (score === 'medium') return 'risk-medium';
    return 'risk-low';
  }

  function formatTime(ts) {
    if (!ts) return '-';
    return new Date(ts).toLocaleString();
  }

  function formatDate(ts) {
    if (!ts) return '-';
    return new Date(ts).toLocaleDateString();
  }

  function renderTokenRow(token) {
    var tr = document.createElement('tr');

    var scopesDisplay = '-';
    if (token.scopes) {
      try {
        var parsed = JSON.parse(token.scopes);
        if (Array.isArray(parsed) && parsed.length > 0) {
          scopesDisplay = parsed.map(function (s) { return '<span class="badge scope-badge low">' + escapeHtml(s) + '</span>'; }).join(' ');
        } else if (typeof parsed === 'string') {
          scopesDisplay = escapeHtml(parsed);
        }
      } catch (e) {
        scopesDisplay = escapeHtml(token.scopes);
      }
    }

    tr.innerHTML =
      '<td><strong>' + escapeHtml(token.name) + '</strong></td>' +
      '<td><span class="token-type ' + escapeHtml(token.tokenType) + '">' + escapeHtml(token.tokenType) + '</span></td>' +
      '<td><div class="scope-list">' + scopesDisplay + '</div></td>' +
      '<td><span class="' + riskClass(token.riskScore) + '">' + escapeHtml(token.riskScore) + '</span></td>' +
      '<td>' + formatDate(token.firstSeenAt) + '</td>' +
      '<td>' + formatDate(token.lastSeenAt) + '</td>' +
      '<td>' + formatDate(token.expiresAt) + '</td>' +
      '<td><button class="delete-btn" data-id="' + token.id + '">Delete</button></td>';

    return tr;
  }

  async function loadTokens() {
    var tbody = document.getElementById('token-tbody');
    try {
      var tokens = await api('/api/inventory/tokens');
      if (tokens.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty" style="text-align:center;">No tokens in inventory.</td></tr>';
      } else {
        tbody.innerHTML = '';
        tokens.forEach(function (token) {
          tbody.appendChild(renderTokenRow(token));
        });
        document.querySelectorAll('.delete-btn').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            if (!confirm('Delete token #' + this.dataset.id + '?')) return;
            try {
              await api('/api/inventory/tokens/' + this.dataset.id, { method: 'DELETE' });
              this.closest('tr').remove();
            } catch (err) {
              alert('Delete failed: ' + err.message);
            }
          });
        });
      }
    } catch (err) {
      if (err.message === 'Authentication required') return;
      tbody.innerHTML = '<tr><td colspan="8" class="empty" style="text-align:center;color:#f0253a;">Error: ' + escapeHtml(err.message) + '</td></tr>';
    }
  }

  async function loadStats() {
    try {
      var stats = await api('/api/inventory/tokens/stats');
      document.getElementById('stat-total').textContent = stats.total || 0;
      document.getElementById('stat-high-risk').textContent = stats.highRisk || 0;
      document.getElementById('stat-expiring').textContent = stats.expiringSoon || 0;
      document.getElementById('stat-expired').textContent = stats.expired || 0;
    } catch (err) {
      if (err.message === 'Authentication required') return;
    }
  }

  document.getElementById('scan-btn').addEventListener('click', async function () {
    var btn = this;
    var statusEl = document.getElementById('scan-status');
    btn.disabled = true;
    statusEl.textContent = 'Scanning...';
    statusEl.className = 'status info';
    try {
      var result = await api('/api/inventory/tokens/scan', { method: 'POST' });
      statusEl.textContent = 'Scan complete: ' + result.tokensFound + ' new, ' + result.tokensUpdated + ' updated';
      statusEl.className = 'status success';
      await loadTokens();
      await loadStats();
    } catch (err) {
      if (err.message === 'Authentication required') return;
      statusEl.textContent = 'Scan failed: ' + err.message;
      statusEl.className = 'status error';
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('drift-btn').addEventListener('click', async function () {
    var btn = this;
    var resultsEl = document.getElementById('drift-results');
    btn.disabled = true;
    resultsEl.style.display = 'block';
    resultsEl.innerHTML = '<p class="loading-msg">Checking for permission drift...</p>';
    try {
      var drift = await api('/api/inventory/tokens/drift');
      if (drift.length === 0) {
        resultsEl.innerHTML = '<p style="color:#26cd6b;">No permission drift detected.</p>';
      } else {
        var html = '<h3 style="font-size:0.72rem;margin-bottom:0.5rem;color:#d29922;text-transform:uppercase;letter-spacing:0.05em;">Permission Drift Detected</h3>';
        drift.forEach(function (d) {
          var cls = d.riskIncreased ? 'risk-critical' : 'risk-high';
          html += '<div style="padding:0.5rem;margin-bottom:0.4rem;background:#14161a;border:0.5px solid rgba(255,255,255,0.05);">';
          html += '<div style="display:flex;justify-content:space-between;align-items:center;">';
          html += '<strong style="color:#e6e8eb;">' + escapeHtml(d.name) + '</strong>';
          html += '<span class="' + cls + '">' + (d.riskIncreased ? 'Risk Increased' : 'Drifted') + '</span>';
          html += '</div>';
          html += '<div style="font-size:0.68rem;margin-top:0.2rem;color:#656b75;">';
          html += 'Stored: ' + (d.storedScopes.length ? d.storedScopes.join(', ') : '(none)');
          html += '</div>';
          html += '<div style="font-size:0.68rem;color:#656b75;">';
          html += 'Current: ' + (d.currentScopes.length ? d.currentScopes.join(', ') : '(none)');
          html += '</div></div>';
        });
        resultsEl.innerHTML = html;
      }
    } catch (err) {
      if (err.message === 'Authentication required') return;
      resultsEl.innerHTML = '<p style="color:#f0253a;">Drift check failed: ' + escapeHtml(err.message) + '</p>';
    } finally {
      btn.disabled = false;
    }
  });

  loadTokens();
  loadStats();
  setInterval(loadTokens, 15000);
  setInterval(loadStats, 30000);
})();
</script>
</body>
</html>
