<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentinel Oracle — Authorize Merge</title>
<link rel="stylesheet" href="/style.css">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--bg-primary);
    font-family: var(--font-sans);
    color: var(--text-main);
  }
  .auth-wrap {
    max-width: 420px;
    width: 100%;
    margin: 1.5rem;
    border: 1px solid var(--border-color);
    background: var(--bg-secondary);
    padding: 2.25rem 2rem;
    text-align: center;
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(10px);
  }
  .auth-wrap h1 {
    font-family: var(--font-mono);
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-main);
    margin-bottom: 0.5rem;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.08);
  }
  .auth-wrap .subtitle {
    color: var(--accent-cyan);
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border-color);
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.1);
  }
  .auth-wrap .status {
    margin: 1.25rem 0 0.5rem;
  }
  .auth-wrap .detail {
    color: var(--text-muted);
    font-size: 0.75rem;
    margin-top: 0.75rem;
    line-height: 1.4;
  }
  .auth-wrap .password-field {
    margin: 1.25rem 0;
    text-align: left;
  }
  .auth-wrap .password-field input {
    padding: 0.625rem 0.875rem;
    font-size: 0.85rem;
    border: 1px solid var(--border-color);
    background: rgba(7, 9, 14, 0.8);
    color: var(--text-main);
    border-radius: 4px;
    width: 100%;
    font-family: var(--font-mono);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .auth-wrap .password-field input:focus {
    border-color: var(--accent-cyan);
    box-shadow: 0 0 8px rgba(0, 240, 255, 0.1);
  }
  .auth-wrap .password-field label {
    display: block;
    margin-bottom: 0.4rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 0.65rem;
    font-weight: 500;
  }
  .auth-wrap .btn {
    width: 100%;
    padding: 0.625rem 1.5rem;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid rgba(0, 230, 118, 0.25);
    color: var(--accent-green);
    background: transparent;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: var(--font-mono);
    border-radius: 4px;
  }
  .auth-wrap .btn:hover {
    background: rgba(0, 230, 118, 0.06);
    border-color: var(--accent-green);
    box-shadow: 0 0 12px rgba(0, 230, 118, 0.2);
  }
  .auth-wrap .btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    box-shadow: none !important;
  }
  .auth-wrap .btn:disabled:hover {
    background: transparent;
    border-color: rgba(0, 230, 118, 0.25);
  }
  #expiry-countdown {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--accent-orange);
    margin-bottom: 1rem;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="auth-wrap">
    <h1>Sentinel Oracle</h1>
    <p class="subtitle">Authorize Merge</p>
    <div id="expiry-countdown"></div>
    <div id="status" class="status"></div>
    <div id="details" class="detail"></div>
    <div class="password-field">
      <label for="auth-password">Authorization Password</label>
      <input type="password" id="auth-password" placeholder="Enter authorization password" autocomplete="off">
    </div>
    <button id="confirm-btn" class="btn" style="display:none">Confirm Authorization</button>
  </div>

  <script>
    function base64urlToBuffer(str) {
      const padding = '='.repeat((4 - str.length % 4) % 4);
      const base64 = (str + padding).replace(/-/g, '+').replace(/_/g, '/');
      const raw = atob(base64);
      const buf = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) buf[i] = raw.charCodeAt(i);
      return buf;
    }

    function prepareOptions(options) {
      return {
        ...options,
        challenge: base64urlToBuffer(options.challenge),
        allowCredentials: options.allowCredentials?.map(c => ({
          ...c,
          id: base64urlToBuffer(c.id),
        })),
      };
    }

    function setStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + (type || '');
    }

    function showDetail(msg) {
      document.getElementById('details').textContent = msg;
    }

    const params = new URLSearchParams(window.location.search);
    const challengeId = params.get('cid');
    const prNumber = params.get('pr');

    if (!challengeId || !prNumber) {
      setStatus('Invalid authorization link', 'error');
    } else {
      let expireAt = Date.now() + 120000;
      document.getElementById('expiry-countdown').textContent = 'Expires in ' + Math.round((expireAt - Date.now()) / 1000) + 's';
      const countdownInterval = setInterval(() => {
        const remaining = Math.round((expireAt - Date.now()) / 1000);
        if (remaining <= 0) {
          clearInterval(countdownInterval);
          document.getElementById('expiry-countdown').textContent = 'Expired';
          document.getElementById('expiry-countdown').style.color = '#f0253a';
          setStatus('Authorization link expired. Please scan a new QR code.', 'error');
          document.getElementById('confirm-btn').disabled = true;
        } else {
          document.getElementById('expiry-countdown').textContent = 'Expires in ' + remaining + 's';
        }
      }, 1000);

      let passwordRequired = false;
      fetch('/api/status').then(r => r.json()).then(s => {
        passwordRequired = !!s.passwordRequired;
        if (!passwordRequired) {
          document.querySelector('.password-field').style.display = 'none';
          showDetail('Tap Confirm with your passkey to authorize');
        } else {
          showDetail('Enter the authorization password and tap Confirm with your passkey');
        }
      }).catch(() => {
        showDetail('Enter the authorization password and tap Confirm with your passkey');
      });
      setStatus('PR #' + prNumber + ' ready for authorization', 'info');
      document.getElementById('confirm-btn').style.display = 'block';
    }

    document.getElementById('confirm-btn')?.addEventListener('click', async () => {
      const btn = document.getElementById('confirm-btn');
      const passwordField = document.getElementById('auth-password');
      const password = passwordField?.value || '';
      btn.disabled = true;
      setStatus('Contacting server...', 'info');
      showDetail('');

      try {
        const { options, challenge } = await fetch('/api/webauthn/assert/begin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prNumber: parseInt(prNumber, 10) }),
        }).then(r => {
          if (r.status === 404) throw new Error('No passkeys registered. Enroll a device first from the dashboard.')
          if (!r.ok) return r.json().then(d => { throw new Error(d.error || 'Failed to get challenge') })
          return r.json()
        })

        setStatus('Authenticating with passkey...', 'info');

        const credential = await navigator.credentials.get({ publicKey: prepareOptions(options) });

        setStatus('Authorizing merge...', 'info');

        const body = {
          challengeId,
          credential: credential.toJSON(),
          challenge,
        };
        if (password) body.password = password;

        const result = await fetch(`/api/prs/${prNumber}/confirm`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        }).then(r => r.json());

        if (result.authorized && result.merged) {
          setStatus('Merge completed successfully', 'success');
          showDetail('PR #' + prNumber + ' has been merged to main');
          btn.style.display = 'none';
        } else if (result.authorized) {
          setStatus('Authorization granted', 'success');
          showDetail('PR #' + prNumber + ' has been authorized (merge pending)');
          btn.style.display = 'none';
        } else {
          const err = result.error || 'Authorization failed'
          if (err.includes('Challenge already') || err.includes('already used')) {
            setStatus('This QR code has already been used', 'error');
            showDetail('If the PR was already merged, check the dashboard. Otherwise, start a new authorization.');
          } else {
            setStatus(err, 'error');
          }
          btn.disabled = false;
        }
      } catch (err) {
        if (err.name === 'NotAllowedError' || err.message?.includes('cancelled')) {
          setStatus('Authentication cancelled', 'error');
          btn.disabled = false;
        } else {
          setStatus(err.message || 'Connection failed', 'error');
          btn.disabled = false;
        }
      }
    });
  </script>
</body>
</html>
