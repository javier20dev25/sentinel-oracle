name: Sentinel PR Bot
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --skipLibCheck
      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > /tmp/pr_diff.txt
          echo "DIFF_SIZE=$(wc -c < /tmp/pr_diff.txt)" >> "$GITHUB_OUTPUT"
      - name: Run Sentinel scan
        id: scan
        env:
          SENTINEL_REPO: ${{ github.repository }}
          SENTINEL_PR: ${{ github.event.pull_request.number }}
        run: |
          node dist/cli/pr_scan.js /tmp/pr_diff.txt > /tmp/sentinel_result.json 2>&1 || true
          if [ -f /tmp/sentinel_result.json ]; then
            echo "FINDINGS=$(jq '.findings | length' /tmp/sentinel_result.json)" >> "$GITHUB_OUTPUT"
            echo "DECISION=$(jq -r '.verdict.decision // "PASS"' /tmp/sentinel_result.json)" >> "$GITHUB_OUTPUT"
          fi
      - name: Post comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let result = { findings: [], verdict: {}, filesAnalyzed: 0 };
            try { result = JSON.parse(fs.readFileSync('/tmp/sentinel_result.json', 'utf8')); } catch {}
            const findings = result.findings ?? [];
            const verdict = result.verdict ?? {};
            const highCrit = findings.filter(f => f.severity === 'HIGH' || f.severity === 'CRITICAL');
            const lowMed = findings.filter(f => f.severity === 'LOW' || f.severity === 'MEDIUM' || f.severity === 'INFO');
            let header = 'PASS';
            if (verdict.decision === 'BLOCK' || highCrit.length > 0) header = 'BLOCK';
            else if (verdict.band === 'SUSPICIOUS') header = 'REVIEW';
            let body = '## Sentinel PR Scan\n\n';
            body += '**Risk Band:** ' + (verdict.band ?? 'SAFE') + '\n';
            body += '**Decision:** ' + (verdict.decision ?? 'PASS') + '\n';
            body += '**Files Analyzed:** ' + (result.filesAnalyzed ?? 0) + '\n';
            body += '**Total Findings:** ' + findings.length + '\n\n';
            if (highCrit.length > 0) {
              body += '### HIGH/CRITICAL (' + highCrit.length + ')\n\n';
              for (const f of highCrit) {
                body += '- **' + f.severity + '** `' + f.type + '` -- ' + f.file + ':' + f.line + '\n';
                if (f.description) body += '  > ' + f.description + '\n';
              }
            }
            if (lowMed.length > 0) body += '### LOW/MEDIUM (' + lowMed.length + ')\n\n';
            if (highCrit.length === 0 && lowMed.length === 0) body += '### No threats detected\n\n';
            body += '---\n_Scanned by Sentinel CLI v4 LiteScanner_';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
            if (verdict.decision === 'BLOCK') {
              await github.rest.checks.create({
                ...context.repo, name: 'Sentinel Security Audit',
                head_sha: context.payload.pull_request.head.sha,
                status: 'completed', conclusion: 'failure',
                output: { title: 'Sentinel blocked this PR', summary: highCrit.length + ' HIGH/CRITICAL findings', text: JSON.stringify(result) }
              });
              core.setFailed('Blocked by Sentinel.');
            } else if (highCrit.length > 0) {
              await github.rest.checks.create({
                ...context.repo, name: 'Sentinel Security Audit',
                head_sha: context.payload.pull_request.head.sha,
                status: 'completed', conclusion: 'neutral',
                output: { title: 'Issues found', summary: highCrit.length + ' HIGH/CRITICAL findings', text: JSON.stringify(result) }
              });
            } else {
              await github.rest.checks.create({
                ...context.repo, name: 'Sentinel Security Audit',
                head_sha: context.payload.pull_request.head.sha,
                status: 'completed', conclusion: 'success',
                output: { title: 'Sentinel passed', summary: 'No threats detected', text: JSON.stringify(result) }
              });
            }
